<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Am I Panel</title>
  <script src="../assets/js/i18next.min.js"></script>
  <script src="../assets/js/i18nextHttpBackend.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=20260902">
  <link rel="stylesheet" href="../assets/css/tailwind.css?v=20260902">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* 스크롤바 방지 */
    }
  </style>
</head>
<body class="toolbar-body">
  <main class="top-toolbar">
    <section class="toolbar-card toolbar-map-card" aria-labelledby="mapSelectionLabel">
      <label id="mapSelectionLabel" for="mapSelect" class="toolbar-card-title">
        Select The Map
      </label>
      <div class="toolbar-card-body toolbar-map-body">
        <select id="mapSelect" onchange="mapSelected()" class="toolbar-select toolbar-map-select">
          <!-- C#에서 맵 목록 추가 -->
        </select>
        <label class="toolbar-language-field" for="tarkovMarketLanguageSelect">
          <span id="tarkovMarketLanguageLabel" class="toolbar-field-label">Map language</span>
          <select
            id="tarkovMarketLanguageSelect"
            aria-labelledby="tarkovMarketLanguageLabel"
            onchange="tarkovMarketLanguageChanged()"
            class="toolbar-select toolbar-language-select"
          >
            <option value="en">English</option>
            <option value="ko">한국어</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
        </label>
      </div>
    </section>

    <section class="toolbar-card toolbar-view-card" aria-labelledby="viewSectionTitle">
      <div id="viewSectionTitle" class="toolbar-card-title">View</div>
      <div class="toolbar-card-body toolbar-view-body">
        <button id="fullScreenButton" type="button" onclick="fullScreen()" class="toolbar-button">
          Full Screen
        </button>
        <button id="hideShowPanelsButton" type="button" onclick="hideShowPanel()" class="toolbar-button">
          Hide/Show Panels
        </button>
      </div>
    </section>

    <section class="toolbar-card toolbar-automation-card" aria-labelledby="automationSectionTitle">
      <div id="automationSectionTitle" class="toolbar-card-title">Automation</div>
      <div class="toolbar-card-body toolbar-automation-grid">
        <label class="toolbar-check-option" for="autoDetect">
          <input type="checkbox" id="autoDetect" class="toolbar-checkbox" onchange="checkboxChanged()">
          <span id="autoScreenshotDetectionLabel">Auto Screenshot Detection</span>
        </label>
        <label class="toolbar-check-option" for="autoMapDetect">
          <input type="checkbox" id="autoMapDetect" class="toolbar-checkbox" onchange="autoMapToggle()">
          <span id="autoMapDetectionLabel">Auto Map Detection</span>
        </label>
        <label class="toolbar-check-option" for="autoPanning">
          <input type="checkbox" id="autoPanning" class="toolbar-checkbox" onchange="autoPanningToggle()">
          <span id="autoPanningLabel">Auto Panning</span>
        </label>
        <label class="toolbar-check-option" for="autoScreenshotCleanup">
          <input
            type="checkbox"
            id="autoScreenshotCleanup"
            class="toolbar-checkbox"
            onchange="autoScreenshotCleanupToggle()"
          >
          <span id="autoScreenshotCleanupLabel">Auto Screenshot Cleanup</span>
        </label>
      </div>
    </section>

    <section class="toolbar-card toolbar-actions-card" aria-labelledby="actionsSectionTitle">
      <div class="toolbar-card-title-row">
        <div id="actionsSectionTitle" class="toolbar-card-title">Actions</div>
        <button
          id="floorDbEditorButton"
          type="button"
          onclick="toggleFloorEditMode()"
          class="toolbar-debug-button"
          style="display: none;"
        >
          Floor DB Editor
        </button>
      </div>
      <div class="toolbar-card-body toolbar-actions-body">
        <button id="forceRunButton" type="button" onclick="forceRun()" class="toolbar-button toolbar-button-primary">
          Force Run
        </button>
        <nav class="toolbar-links" aria-label="Help links">
          <a id="howToUseLink" href="https://github.com/karpitony/eft-where-am-i/blob/main/README.md">
            How To Use
          </a>
          <span class="toolbar-link-divider" aria-hidden="true"></span>
          <a id="bugLink" href="https://github.com/karpitony/eft-where-am-i/issues">
            Bug Report
          </a>
        </nav>
      </div>
    </section>
  </main>

  <script>
    i18next
      .use(i18nextHttpBackend)
      .init({
        lng: "en",
        fallbackLng: "en",
        debug: false,
        backend: {
          loadPath: "https://appassets/{{lng}}.json"
        }
      })
      .then(() => {
        updateContent();
      })
      .catch(err => console.error("i18next 초기화 오류:", err));

    // DOM에 번역 적용 함수
    function updateContent() {
      document.getElementById('mapSelectionLabel').textContent = i18next.t('mapSelectionLabel');
      document.getElementById('viewSectionTitle').textContent = i18next.t('viewSectionTitle');
      document.getElementById('automationSectionTitle').textContent = i18next.t('automationSectionTitle');
      document.getElementById('actionsSectionTitle').textContent = i18next.t('actionsSectionTitle');
      document.getElementById('autoScreenshotDetectionLabel').textContent = i18next.t('autoScreenshotDetectionLabel');
      document.getElementById('hideShowPanelsButton').textContent = i18next.t('hideShowPanelsButton');
      document.getElementById('fullScreenButton').textContent = i18next.t('fullScreenButton');
      document.getElementById('tarkovMarketLanguageLabel').textContent = i18next.t('tarkovMarketLanguageLabel');
      document.getElementById('forceRunButton').textContent = i18next.t('forceRunButton');
      document.getElementById('howToUseLink').textContent = i18next.t('howToUseLink');
      document.getElementById('bugLink').textContent = i18next.t('bugLink');
      document.getElementById('autoMapDetectionLabel').textContent = i18next.t('autoMapDetectionLabel');
      document.getElementById('autoPanningLabel').textContent = i18next.t('autoPanningLabel');
      document.getElementById('floorDbEditorButton').textContent = i18next.t('floorDbEditorButton');
      document.getElementById('autoScreenshotCleanupLabel').textContent = i18next.t('autoScreenshotCleanupLabel');
    }

    function setTheme(theme) {
      try {
        document.body.classList.toggle('theme-dark', theme === 'dark');
      } catch (error) {
        console.error("setTheme 오류 발생: ", error);
      }
    }

    // C#에서 호출하는 함수: 언어 설정
    function setLanguage(language) {
      try {
        // i18next를 통해 언어 변경 (비동기 처리는 필요시 then()으로 체이닝 가능)
        i18next.changeLanguage(language)
          .then(() => {
            updateContent(); // DOM 텍스트 업데이트
          })
          .catch(error => {
            console.error("i18next changeLanguage 오류 발생:", error);
          });
        console.log("Language set to:", language); // 디버그용 출력
      } catch (error) {
        console.error("setLanguage 오류 발생: ", error);
      }
    }

    // C#에서 호출하는 함수: 맵 목록 채우기
    function populateMapList(mapsJson, selectedMap) {
      try {
        const maps = JSON.parse(mapsJson);
        const select = document.getElementById('mapSelect');
        select.innerHTML = '';

        maps.forEach(map => {
            const option = document.createElement('option');
            const value = typeof map === 'string' ? map : map.value;
            const label = typeof map === 'string' ? map : map.label;
            option.value = value;
            option.textContent = label;
            select.appendChild(option);
        });

        if (selectedMap) {
          select.value = selectedMap;
        }
        console.log("기본 선택된 맵:", selectedMap); // 디버그용 출력
      } catch (error) {
          console.error("populateMapList 오류: ", error);
      }
    }

    // C#에서 호출하는 함수: 초기 체크박스 상태 설정
    function setCheckboxState(isChecked) {
      try {
          const checkbox = document.getElementById('autoDetect');
          checkbox.checked = isChecked;
          console.log("Checkbox state set to:", isChecked);  // 디버그용 출력
      } catch (error) {
          console.error("setCheckboxState 오류 발생: ", error);
      }
    }

    // 맵 선택 시 C#으로 상태 전달
    function mapSelected() {
      const selectedMap = document.getElementById('mapSelect').value;
      console.log("Selected map:", selectedMap);  // 디버그용 콘솔 출력
      window.chrome.webview.postMessage(JSON.stringify({ action: 'map-selected', map: selectedMap }));
    }

    // 체크박스 상태 변경 시 C#으로 상태 전달
    function checkboxChanged() {
      const isChecked = document.getElementById('autoDetect').checked;
      console.log("Checkbox state changed to:", isChecked);  // 디버그용 콘솔 출력
      window.chrome.webview.postMessage(JSON.stringify({ action: 'checkbox-updated', isChecked: isChecked }));
    }

    // Tarkov Market 패널 표시 상태 토글
    function hideShowPanel() {
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'hide-show-panel'
      }));
    }

    // C#에서 호출: Tarkov Market 언어 상태 설정
    function setTarkovMarketPreferences(language) {
      try {
        document.getElementById('tarkovMarketLanguageSelect').value = language;
      } catch (error) {
        console.error("setTarkovMarketPreferences error:", error);
      }
    }

    // Tarkov Market 언어 변경
    function tarkovMarketLanguageChanged() {
      const language = document.getElementById('tarkovMarketLanguageSelect').value;
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'tarkov-market-language-changed',
        language: language
      }));
    }

    // Full Screen 버튼 클릭 시
    function fullScreen() {
      window.chrome.webview.postMessage(JSON.stringify({
          action: 'full-screen'
      }));
    }

    // Force Run 버튼 클릭 시
    function forceRun() {
      window.chrome.webview.postMessage(JSON.stringify({
          action: 'force-run'
      }));
    }

    // Auto Map Detection 토글
    function autoMapToggle() {
      const isChecked = document.getElementById('autoMapDetect').checked;
      window.chrome.webview.postMessage(JSON.stringify({ action: 'auto-map-toggle', isChecked: isChecked }));
    }

    // C#에서 호출: 자동 맵 감지 체크박스 상태 설정
    function setAutoMapCheckboxState(isChecked) {
      try {
        const checkbox = document.getElementById('autoMapDetect');
        checkbox.checked = isChecked;
      } catch (error) {
        console.error("setAutoMapCheckboxState error:", error);
      }
    }

    // Auto Panning 토글
    function autoPanningToggle() {
      const isChecked = document.getElementById('autoPanning').checked;
      window.chrome.webview.postMessage(JSON.stringify({ action: 'auto-panning-toggle', isChecked: isChecked }));
    }

    // C#에서 호출: 자동 패닝 체크박스 상태 설정
    function setAutoPanningCheckboxState(isChecked) {
      try {
        const checkbox = document.getElementById('autoPanning');
        checkbox.checked = isChecked;
      } catch (error) {
        console.error("setAutoPanningCheckboxState error:", error);
      }
    }

    // Auto Screenshot Cleanup 토글
    function autoScreenshotCleanupToggle() {
      const isChecked = document.getElementById('autoScreenshotCleanup').checked;
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'auto-screenshot-cleanup-toggle', isChecked: isChecked
      }));
    }

    // C#에서 호출: 스크린샷 자동 삭제 체크박스 상태 설정
    function setAutoScreenshotCleanupCheckboxState(isChecked) {
      try {
        document.getElementById('autoScreenshotCleanup').checked = isChecked;
      } catch (error) {
        console.error("setAutoScreenshotCleanupCheckboxState error:", error);
      }
    }

    // C#에서 호출: 디버그 모드 설정 (Floor DB Editor 버튼 표시/숨김)
    function setDebugMode(isDebug) {
      try {
        const btn = document.getElementById('floorDbEditorButton');
        btn.style.display = isDebug ? 'inline-flex' : 'none';
      } catch (error) {
        console.error("setDebugMode error:", error);
      }
    }

    // Floor Zone Edit Mode 토글
    function toggleFloorEditMode() {
      window.chrome.webview.postMessage(JSON.stringify({ action: 'toggle-floor-edit-mode' }));
    }

    // How To Use 링크
    document.querySelector('#howToUseLink').addEventListener('click', function(e) {
      e.preventDefault();
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'link-clicked',
        url: this.href
      }));
    });

    // Bug Report 링크
    document.querySelector('#bugLink').addEventListener('click', function(e) {
      e.preventDefault();
      window.chrome.webview.postMessage(JSON.stringify({
        action: 'link-clicked',
        url: this.href
      }));
    });
  </script>
</body>
</html>
